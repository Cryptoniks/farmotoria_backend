name: CI

# Деплой делает сам Render/Vercel по push в main.
# Здесь только проверки: тесты, миграции, линтер, сборка фронтенда.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DJANGO_SETTINGS_MODULE: farmotoria_backend.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 game farmotoria_backend --max-line-length=130 --exclude=migrations
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=game --cov-report=term-missing
